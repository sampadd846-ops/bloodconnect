<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodConnect | Blood Availability</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            position: relative;
            background: linear-gradient(135deg, #b71c1c, #e53935);
            color: white;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 17px;
            opacity: 0.95;
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 10px 20px;
            background: white;
            color: #c62828;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #f5f5f5;
            transform: translateY(-1px);
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 0 20px;
        }

        /* =========================
           SEARCH BOX
        ========================== */

        .search-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .search-title {
            margin-bottom: 25px;
        }

        .search-title h2 {
            font-size: 28px;
            color: #222;
            margin-bottom: 7px;
        }

        .search-title p {
            color: #777;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #d4d4d4;
            border-radius: 8px;
            background: white;
            outline: none;
            min-width: 180px;
            cursor: pointer;
        }

        select:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #d32f2f;
            color: white;
            cursor: pointer;
            min-width: 160px;
            transition: 0.2s;
        }

        button:hover {
            background: #b71c1c;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           RESULTS
        ========================== */

        #results {
            margin-top: 30px;
        }

        .results-heading {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        /* =========================
           CARD
        ========================== */

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 18px;
            border-radius: 14px;
            border-left: 6px solid #d32f2f;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .card h3 {
            color: #c62828;
            font-size: 21px;
        }

        .status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info {
            padding: 12px;
            background: #f8f9fb;
            border-radius: 8px;
        }

        .info strong {
            display: block;
            font-size: 13px;
            color: #777;
            margin-bottom: 4px;
        }

        .info span {
            font-size: 15px;
            color: #222;
        }

        .units {
            color: #2e7d32 !important;
            font-weight: bold;
            font-size: 17px !important;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
            font-size: 16px;
            color: #555;
        }

        .error-message {
            border-left: 5px solid #f44336;
            color: #c62828;
        }

        .success-message {
            border-left: 5px solid #4caf50;
        }

        /* =========================
           LOADING
        ========================== */

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #ddd;
            border-top: 3px solid #d32f2f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            header {
                padding: 28px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            header p {
                font-size: 14px;
            }

            .login-btn {
                top: 15px;
                right: 15px;
                padding: 8px 14px;
                font-size: 13px;
            }

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .search-box {
                padding: 22px;
            }

            .search-title h2 {
                font-size: 23px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            select,
            button {
                width: 100%;
                min-width: 0;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a href="/login.html" class="login-btn">Login</a>

        <div class="logo">🩸</div>

        <h1>BloodConnect</h1>

        <p>Blood Bank Availability Management System</p>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">

        <!-- SEARCH SECTION -->

        <div class="search-box">

            <div class="search-title">

                <h2>Find Available Blood</h2>

                <p>
                    Search for available blood units by blood group and city.
                </p>

            </div>


            <div class="form-row">

                <select id="bloodGroup">

                    <option value="">Select Blood Group</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>

                    <option value="B+">B+</option>
                    <option value="B-">B-</option>

                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <select id="city">

                    <option value="">Select City</option>

                    <option value="Midnapore">Midnapore</option>
                    <option value="Kharagpur">Kharagpur</option>
                    <option value="Jhargram">Jhargram</option>

                </select>


                <button id="searchButton" onclick="searchBlood()">
                    Search Blood
                </button>

            </div>

        </div>


        <!-- RESULTS -->

        <div id="results"></div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        BloodConnect © 2026 | Blood Bank Availability Management System

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        async function searchBlood() {

            const group =
                document.getElementById("bloodGroup").value;

            const city =
                document.getElementById("city").value;

            const results =
                document.getElementById("results");

            const button =
                document.getElementById("searchButton");


            /* =========================
               VALIDATION
            ========================== */

            if (!group || !city) {

                results.innerHTML = `
                    <div class="message error-message">
                        ⚠️ Please select both blood group and city.
                    </div>
                `;

                return;
            }


            /* =========================
               LOADING
            ========================== */

            button.disabled = true;

            button.innerHTML = "Searching...";


            results.innerHTML = `
                <div class="message loading">
                    <div class="spinner"></div>
                    <span>Searching blood availability...</span>
                </div>
            `;


            try {

                const response = await fetch(
                    `/api/blood/search?group=${encodeURIComponent(group)}&city=${encodeURIComponent(city)}`
                );


                if (!response.ok) {

                    throw new Error("Server error");

                }


                const data = await response.json();


                /* =========================
                   NO RESULT
                ========================== */

                if (data.length === 0) {

                    results.innerHTML = `
                        <div class="message error-message">

                            ❌ No blood available

                            <br><br>

                            <span>
                                No ${group} blood is currently available
                                in ${city}.
                            </span>

                        </div>
                    `;

                    return;
                }


                /* =========================
                   RESULTS FOUND
                ========================== */

                results.innerHTML = `
                    <div class="results-heading">
                        🩸 Available Blood Banks
                    </div>
                `;


                data.forEach(item => {

                    const bank = item.bloodBank;


                    let lastUpdated = "Not available";


                    if (item.lastUpdated) {

                        const date =
                            new Date(item.lastUpdated);

                        if (!isNaN(date)) {

                            lastUpdated =
                                date.toLocaleString();

                        }

                    }


                    results.innerHTML += `

                        <div class="card">

                            <div class="card-header">

                                <h3>
                                    🩸 ${bank.name}
                                </h3>

                                <span class="status">
                                    ✓ Available
                                </span>

                            </div>


                            <div class="info-grid">


                                <div class="info">

                                    <strong>
                                        Blood Group
                                    </strong>

                                    <span>
                                        ${item.bloodGroup}
                                    </span>

                                </div>


                                <div class="info">

                                    <strong>
                                        Available Units
                                    </strong>

                                    <span class="units">
                                        ${item.unitsAvailable} units
                                    </span>

                                </div>


                                <div class="info">

                                    <strong>
                                        City
                                    </strong>

                                    <span>
                                        📍 ${bank.city}
                                    </span>

                                </div>


                                <div class="info">

                                    <strong>
                                        Phone
                                    </strong>

                                    <span>
                                        ☎ ${bank.phone}
                                    </span>

                                </div>


                                <div class="info">

                                    <strong>
                                        Address
                                    </strong>

                                    <span>
                                        ${bank.address}
                                    </span>

                                </div>


                                <div class="info">

                                    <strong>
                                        Last Updated
                                    </strong>

                                    <span>
                                        🕐 ${lastUpdated}
                                    </span>

                                </div>


                            </div>

                        </div>

                    `;

                });


            } catch (error) {

                results.innerHTML = `

                    <div class="message error-message">

                        ⚠️ Unable to connect to the server.

                        <br><br>

                        Please make sure the Spring Boot server
                        is running.

                    </div>

                `;

                console.error(error);

            } finally {

                button.disabled = false;

                button.innerHTML = "Search Blood";

            }

        }

    </script>

</body>

</html>
