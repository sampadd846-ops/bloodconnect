<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodConnect - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f5, #ffe0e0);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 50px;
        }

        .logo h1 {
            color: #c62828;
            font-size: 30px;
            margin-top: 8px;
        }

        .logo p {
            color: #777;
            margin-top: 6px;
            font-size: 14px;
        }

        .role-selection {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 13px 8px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .role-btn.active {
            border-color: #c62828;
            background: #fff0f0;
            color: #c62828;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c62828;
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #a91f1f;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        .error {
            color: #d32f2f;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #c62828;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">🩸</div>
        <h1>BloodConnect</h1>
        <p>Secure Login Portal</p>
    </div>

    <div class="role-selection">

        <button class="role-btn active"
                id="adminBtn"
                onclick="selectRole('ADMIN')">
            👑 Admin
        </button>

        <button class="role-btn"
                id="managerBtn"
                onclick="selectRole('MANAGER')">
            🏥 Manager
        </button>

    </div>

    <form onsubmit="login(event)">

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="/" class="back-link">
        ← Back to Blood Search
    </a>

</div>

<script>

    let selectedRole = "ADMIN";

    function selectRole(role) {

        selectedRole = role;

        document
            .getElementById("adminBtn")
            .classList
            .remove("active");

        document
            .getElementById("managerBtn")
            .classList
            .remove("active");

        if (role === "ADMIN") {

            document
                .getElementById("adminBtn")
                .classList
                .add("active");

        } else {

            document
                .getElementById("managerBtn")
                .classList
                .add("active");

        }
    }


    async function login(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Logging in...";
        message.className = "message";


        try {

            const response = await fetch(
                `/api/auth/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                {
                    method: "POST"
                }
            );


            if (!response.ok) {

                throw new Error("Invalid username or password");

            }


            const user = await response.json();


            if (user.role !== selectedRole) {

                throw new Error(
                    "Please select the correct login type"
                );

            }


            // Save logged-in user information
            sessionStorage.setItem(
                "bloodconnectUser",
                JSON.stringify(user)
            );


            // Redirect according to role
            if (user.role === "ADMIN") {

                window.location.href = "/admin.html";

            } else {

                window.location.href = "/manager.html";

            }

        } catch (error) {

            message.textContent = error.message;
            message.className = "message error";

        }

    }

</script>

</body>
</html>
